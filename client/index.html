<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tebb 小伴</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #bubble, #menu {
        position: absolute;
        z-index: 3;
        color: #f4f1ea;
        user-select: text;
        -webkit-user-select: text;
      }
      #bubble {
        max-width: 220px;
        box-sizing: border-box;
        padding: 8px 12px;
        background: rgba(12, 14, 18, 0.92);
        border: 1px solid rgba(255, 212, 41, 0.7);
        border-radius: 12px;
        max-height: 210px;
        overflow: auto;
        font-size: 14px;
        line-height: 1.5;
        pointer-events: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #bubble.hidden, #menu.hidden { display: none; }
      #bubble[data-kind="error"] { border-color: #ff6b6b; color: #ffb4b4; }
      #menu {
        display: flex;
        flex-direction: column;
        min-width: 160px;
        background: rgba(12, 14, 18, 0.94);
        border: 1px solid rgba(255, 212, 41, 0.55);
      }
      #menu.hidden { display: none; }
      #menu button {
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: transparent;
        color: #f4f1ea;
        text-align: left;
        padding: 8px 12px;
        cursor: pointer;
        user-select: text;
        -webkit-user-select: text;
      }
      #menu button:last-child { border-bottom: 0; }
      #menu button:hover { background: rgba(255, 212, 41, 0.16); color: #ffd429; }
      #menu button:disabled { color: #888; cursor: default; }
      [data-menu-hint] { padding: 8px 12px; font-size: 11px; max-width: 200px; color: #aaa; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble" class="hidden" data-pet-bubble data-kind="line"></div>
    <div id="menu" class="hidden" data-pet-menu>
      <button type="button" data-action="chat">打开对话框</button>
      <button type="button" data-action="close_chat">关闭对话框</button>
      <button type="button" data-action="close_bubble">关闭提示</button>
      <button type="button" data-action="today">今天的安排</button>
      <button type="button" data-action="hide">隐藏</button>
      <button type="button" data-action="main">打开主窗口</button>
      <button type="button" data-action="quit">退出</button>
      <button type="button" data-action="copy" disabled>复制选中文字</button>
      <div data-menu-hint>可拖选文字，按 Ctrl+C 复制</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
